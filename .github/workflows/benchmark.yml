name: Fractal Benchmark
on: [push]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: sudo apt-get install -y g++ make
      - name: Build and run
        run: |
          cd submission/src
          mkdir -p output
          make
          bash run.sh
